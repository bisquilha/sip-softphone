# Softphone no softphone-server: Hub (chat/presença/diretório) atrás do nginx com HTTPS da CORP-ROOT-CA.
# Subir/atualizar: docker compose up -d --build     Logs: docker compose logs -f hub
services:
  hub:
    build: .
    image: softphone-hub:latest
    restart: unless-stopped
    env_file: hub.env
    volumes:
      - /opt/softphone/dados:/dados
      - /opt/softphone/kerberos/softphone.keytab:/etc/softphone/softphone.keytab:ro
      - ./krb5.conf:/etc/krb5.conf:ro
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # Transcrição LOCAL das ligações gravadas (o áudio não sai do servidor). faster-whisper, modelo "small", só CPU.
  # O Hub chama em http://whisper:9000 (rede interna do compose; a porta não fica exposta).
  # O modelo (~500 MB) é baixado no primeiro uso e fica em /opt/softphone/whisper-cache.
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    restart: unless-stopped
    environment:
      ASR_ENGINE: faster_whisper
      ASR_MODEL: small
    volumes:
      - /opt/softphone/whisper-cache:/root/.cache
    deploy:
      resources:
        limits: { cpus: "3", memory: 3g }   # deixa folga para o Hub e o Jitsi (VM de 4 vCPU / 8 GB)
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [hub]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /opt/softphone/certs:/certs:ro
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
