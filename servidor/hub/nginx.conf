events {}

http {
    server_tokens off;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    # HTTP -> HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # Hub do Softphone (chat, presença, diretório)
    server {
        listen 443 ssl;
        http2 on;
        server_name softphone.corp.example.com softphone.corp.example.com 192.0.2.5;

        ssl_certificate     /certs/softphone.crt;
        ssl_certificate_key /certs/softphone.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # arquivos do chat (o Hub limita em 25 MB) e gravações de ligação (até 400 MB ≈ 3 h em 8 kHz estéreo)
        client_max_body_size 410m;

        location / {
            proxy_pass http://hub:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;          # WebSocket do SignalR
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }
    }

    # Reuniões (Jitsi Meet). O endereço do contêiner "web" do Jitsi é resolvido na hora (resolver do Docker),
    # então o nginx sobe mesmo se o Jitsi ainda não estiver instalado.
    server {
        listen 443 ssl;
        http2 on;
        server_name meet.corp.example.com;

        ssl_certificate     /certs/softphone.crt;
        ssl_certificate_key /certs/softphone.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        resolver 127.0.0.11 valid=30s ipv6=off;
        set $jitsi web:8000;   # imagens novas do Jitsi (sem root) escutam na 8000, não na 80

        location / {
            proxy_pass http://$jitsi;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;          # /xmpp-websocket e /colibri-ws
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }
    }
}
